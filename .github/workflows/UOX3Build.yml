name: UOX3 Build

on:
  workflow_dispatch:
  push:

    # For pushes, only trigger against main branches
    branches:
      - master
      - develop

    paths-ignore:
      - '**.js'
      - '**.dfn'
      - '**.scp'
      - '**.txt'
      - '**.md'
      - '**.html'
      - '**.sln'
      - '**.vcxproj'
      - '**.xcodeproj'
    tags-ignore:
      - 'v*-release' # This will ignore all version tags ending with '-release' like v1.0-release

  # For pull requests, trigger when new PR is opened AND whenever PR is updated
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.dfn'
      - '**.scp'
      - '**.txt'
      - '**.md'
      - '**.html'
      - '**.sln'
      - '**.vcxproj'
      - '**.xcodeproj'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake make/cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Configure CMake (Windows ClangCL)
      if: runner.os == 'Windows'
      run: cmake make/cmake -B ${{ github.workspace }}/build -T ClangCL

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}

  build-freebsd:
    name: Build (freebsd-latest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build UOX3 on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake curl gmake
          run: |
            cmake make/cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            cmake --build build --config ${{ env.BUILD_TYPE }}


